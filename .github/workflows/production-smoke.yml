name: Production smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      smoke_base_url:
        description: Approved DreamEx production or Vercel deployment URL
        required: true
        default: https://www.dreamex.tech
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Verify deployed production routes and security headers
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build and verify source metadata
        run: |
          npm run build
          npm run verify:build
          npm run verify:i18n
      - name: Smoke-test the deployed origin
        env:
          SMOKE_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_base_url || 'https://www.dreamex.tech' }}
        run: npm run smoke:production
      - name: Install Chromium for policy-enforced browser smoke
        run: npx playwright install --with-deps chromium
      - name: Smoke-test critical routes in Chromium
        env:
          SMOKE_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_base_url || 'https://www.dreamex.tech' }}
        run: npm run smoke:browser
