name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, build, and verify output
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript checks
        run: npm run typecheck
      - name: API security boundary tests
        run: npm run test:unit
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify production output
        run: npm run verify:build
      - name: Verify bilingual content
        run: npm run verify:i18n
